name: status

# Weekly: when godot-builds has a stable release newer than the build recorded in findings.csv,
# re-run the repros on it and rewrite the README status table. Findings 1, 3, 4, 6 and 7 run on
# Linux, 2 and 5 on Windows; 8 and 9 get their upstream state only; 10 is not tracked.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: status
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.latest.outputs.tag }}
      newer: ${{ steps.latest.outputs.newer }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      - id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/run_findings.py latest --github-output "$GITHUB_OUTPUT"

  linux:
    needs: check
    if: needs.check.outputs.newer == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      - run: >-
          python3 tools/run_findings.py run --platform linux --findings 1,3,4,6,7
          --tag "${{ needs.check.outputs.tag }}" --out "$RUNNER_TEMP/results-linux.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: results-linux
          path: ${{ runner.temp }}/results-linux.json
          retention-days: 7

  windows:
    needs: check
    if: needs.check.outputs.newer == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      - shell: pwsh
        run: >-
          python tools/run_findings.py run --platform windows --findings 2,5
          --tag "${{ needs.check.outputs.tag }}" --out "$env:RUNNER_TEMP/results-windows.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: results-windows
          path: ${{ runner.temp }}/results-windows.json
          retention-days: 7

  update:
    needs: [check, linux, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: results-*
          path: ${{ runner.temp }}/results
          merge-multiple: true
      - name: Rewrite the status table
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 tools/run_findings.py table --record-build
          --results "$RUNNER_TEMP/results/results-linux.json" "$RUNNER_TEMP/results/results-windows.json"
      - name: Guard (PII scan; only the status table and build column change)
        run: python3 tools/run_findings.py guard
      - name: Commit
        run: |
          if git diff --quiet; then
            echo "No change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "status: update findings table"
          git push origin HEAD:main
